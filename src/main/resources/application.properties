server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/eventdb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

# Override these with environment variables in production.
portal.admin.username=${ADMIN_USERNAME:admin}
portal.admin.password=${ADMIN_PASSWORD:admin123}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
